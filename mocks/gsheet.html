<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game directions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1800px;height:1372px;background:#111113;color:#f2f2f3;font-family:"Inter Tight",sans-serif;overflow:hidden}
  h1{margin:0;padding:34px 40px 4px;font:600 34px "Inter Tight";letter-spacing:-.03em}
  h1 span{color:#8a8a92;font-weight:500}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 28px;padding:20px 40px 0}
  figure{margin:0}
  img{display:block;width:100%;aspect-ratio:1440/900;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
  figcaption{display:flex;align-items:baseline;gap:12px;margin-top:13px}
  figcaption b{font:700 26px "Inter Tight";letter-spacing:-.03em}
  figcaption i{font:500 12px "JetBrains Mono";font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:#ff6a2b}
  figure p{margin:6px 0 0;font:500 16.5px/1.35 "Inter Tight";color:#a6a6ae;letter-spacing:-.01em}
</style>
</head>
<body>
<h1>Caden Keen portfolio <span>— four video-game directions. Each is a still of the first screen.</span></h1>
<div class="grid">
  <figure><img src="out/g1-handheld.jpg"><figcaption><i>Option G1</i><b>Handheld RPG</b></figcaption><p>8-bit, limited palette. Status panel with stat bars, a pixel desk scene, a dialog box and a cursor menu.</p></figure>
  <figure><img src="out/g2-jrpg.jpg"><figcaption><i>Option G2</i><b>16-bit RPG menu</b></figcaption><p>Blue status-screen windows. Projects are quests, the tech stack is equipment, experience is the party log.</p></figure>
  <figure><img src="out/g3-arcade.jpg"><figcaption><i>Option G3</i><b>Arcade CRT</b></figcaption><p>Neon on black with scanlines. Stage select for the projects and a high-score table built from résumé numbers.</p></figure>
  <figure><img src="out/g4-modern.jpg"><figcaption><i>Option G4</i><b>Modern console menu</b></figcaption><p>Bold italic type, skewed panels, one accent colour. Vertical main menu, large project card, button prompts.</p></figure>
</div>
</body>
</html>
