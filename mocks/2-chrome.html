<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option 2 — Chrome</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1440px;height:900px;background:#060607;color:#f1eee8;overflow:hidden;font-family:"Inter Tight",sans-serif}
  .bg{position:absolute;inset:0;background:
    radial-gradient(46% 52% at 80% 52%,rgba(255,96,32,.20),transparent 70%),
    radial-gradient(38% 44% at 96% 10%,rgba(70,110,255,.20),transparent 70%),
    radial-gradient(60% 60% at 20% 100%,rgba(255,255,255,.035),transparent 70%)}
  .mono{font:500 12px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
  .nav{position:absolute;top:30px;left:48px;right:48px;display:flex;justify-content:space-between;align-items:center;z-index:3}
  .nav ul{display:flex;gap:40px;list-style:none;margin:0;padding:0;color:#9b978f}
  .nav ul li:first-child{color:#fff}
  .pill{background:#f1eee8;color:#0a0a0a;padding:12px 20px;border-radius:999px}
  h1{position:absolute;left:44px;top:96px;margin:0;font:400 338px/.9 "Anton";letter-spacing:-.012em;text-transform:uppercase;color:#f1eee8}
  h1 span{display:block}
  canvas{position:absolute;left:724px;top:22px;width:840px;height:840px;z-index:2}
  .shadow{position:absolute;left:900px;top:740px;width:520px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,90,30,.38),transparent);filter:blur(18px);z-index:1}
  .lede{position:absolute;left:48px;bottom:44px;width:470px;font:500 25px/1.24 "Inter Tight";letter-spacing:-.02em;z-index:3}
  .lede span{color:#8f8b84}
  .list{position:absolute;left:600px;bottom:44px;z-index:3;line-height:2.1;color:#8f8b84}
  .list b{color:#f1eee8;font-weight:500}
  .list i{font-style:normal;color:#ff5a1f;margin-right:14px}
  .br{position:absolute;right:48px;bottom:44px;text-align:right;color:#8f8b84;z-index:3;line-height:2}
  .tag{position:absolute;left:1296px;top:214px;z-index:3;color:#f1eee8;display:flex;align-items:center;gap:10px}
  .tag::before{content:"";width:42px;height:1px;background:#f1eee8}
  .grain{position:absolute;inset:0;z-index:4;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>
</head>
<body>
<div class="bg"></div>
<h1><span>Caden</span><span>Keen</span></h1>
<div class="shadow"></div>
<canvas id="b" width="1260" height="1260"></canvas>
<div class="nav mono"><span>Caden Keen — Software Engineer</span><ul><li>Work</li><li>Experience</li><li>About</li><li>Contact</li></ul><span class="pill">Résumé ↗</span></div>
<p class="tag mono">Drag it</p>
<p class="lede">I train the model, write the API, design the screen, and ship it. <span>Graduating May 2027.</span></p>
<p class="list mono"><i>01</i><b>ChordCraft</b> — AI chord generator<br><i>02</i><b>PokéIQ</b> — Multiplayer game platform</p>
<p class="br mono">Newark, DE · 1:42 PM ET<br>Scroll ↓</p>
<div class="grain"></div>
<script>
const S = 1260, cv = document.getElementById('b'), ctx = cv.getContext('2d'), img = ctx.createImageData(S, S), px = img.data;
const B = [[0,0,0,1.02],[0.92,0.5,0.15,0.62],[-0.74,-0.46,0.2,0.74],[0.32,-0.98,-0.1,0.54],[-0.42,0.92,0.05,0.5],[0.1,0.25,0.8,0.5]];
const K = 0.58;
function sdf(x, y, z) {
  let d = 1e9;
  for (let i = 0; i < B.length; i++) {
    const b = B[i], s = Math.hypot(x - b[0], y - b[1], z - b[2]) - b[3];
    const h = Math.max(K - Math.abs(d - s), 0) / K;
    d = Math.min(d, s) - h * h * K * 0.25;
  }
  d += 0.035 * Math.sin(3.1 * x + 1.0) * Math.sin(2.7 * y + 0.4) * Math.sin(3.3 * z + 2.0);
  return Math.min(d, Math.hypot(x - 1.72, y + 1.18, z - 0.1) - 0.2, Math.hypot(x + 1.5, y - 1.42, z) - 0.11);
}
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const L1 = (() => { const v = [-0.52, 0.78, 0.36], l = Math.hypot(...v); return v.map(q => q / l); })();
function env(x, y, z, out) {
  let r = 0.012, g = 0.012, b = 0.017;
  if (y >= 0) {                      // sky: bright at the horizon, deep blue overhead
    const k = Math.exp(-y * 5.5) * 1.45; r += 0.95 * k; g += 0.97 * k; b += k;
    const zen = ss(0.2, 1, y) * 0.1; r += 0.25 * zen; g += 0.4 * zen; b += zen;
  } else {                           // floor: an orange glow near the horizon, then black
    const k = Math.exp(y * 7) * 1.3; r += k; g += 0.42 * k; b += 0.13 * k;
  }
  const az = Math.atan2(x, z), el = Math.asin(Math.max(-1, Math.min(1, y)));
  const key = ss(0.06, 0, Math.abs(az + 0.9) - 0.42) * ss(0.05, 0, Math.abs(el - 0.75) - 0.22) * 3.1;      // softbox
  r += key; g += key * 0.95; b += key * 0.86;
  const cool = ss(0.03, 0, Math.abs(az - 1.25) - 0.07) * ss(0.08, 0, Math.abs(el - 0.25) - 0.55) * 2.5;   // blue strip
  r += 0.45 * cool; g += 0.72 * cool; b += cool;
  const warm = ss(0.03, 0, Math.abs(az + 1.95) - 0.05) * ss(0.08, 0, Math.abs(el - 0.1) - 0.5) * 2.3;      // orange strip
  r += warm; g += 0.5 * warm; b += 0.18 * warm;
  out[0] = r; out[1] = g; out[2] = b;
}
const c = [0, 0, 0], FOV = 0.5, e = 0.0025;
for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
  const u = (i / S * 2 - 1) * FOV, v = -(j / S * 2 - 1) * FOV, il = 1 / Math.hypot(u, v, 1);
  const dx = u * il, dy = v * il, dz = -il;
  let t = 2.6, hit = false, minD = 1e9, mt = t;
  for (let s = 0; s < 70; s++) {
    const d = sdf(dx * t, dy * t, 5 + dz * t);
    if (d < minD) { minD = d; mt = t; }
    if (d < 0.0018) { hit = true; break; }
    t += d * 0.92; if (t > 7.6) break;
  }
  const alpha = hit ? 1 : ss(0.011, 0.0, minD);
  const o = (j * S + i) * 4;
  if (alpha <= 0) { px[o + 3] = 0; continue; }
  if (!hit) t = mt;
  const x = dx * t, y = dy * t, z = 5 + dz * t;
  let nx = sdf(x + e, y, z) - sdf(x - e, y, z), ny = sdf(x, y + e, z) - sdf(x, y - e, z), nz = sdf(x, y, z + e) - sdf(x, y, z - e);
  const nl = 1 / Math.hypot(nx, ny, nz); nx *= nl; ny *= nl; nz *= nl;
  const nv = Math.max(0, -(nx * dx + ny * dy + nz * dz)), k = 2 * (dx * nx + dy * ny + dz * nz);
  env(dx - k * nx, dy - k * ny, dz - k * nz, c);
  const F = 0.7 + 0.3 * Math.pow(1 - nv, 4);
  for (let q = 0; q < 3; q++) {
    const film = 0.5 + 0.5 * Math.cos(6.283 * (1.15 * nv + [0.0, 0.33, 0.67][q]));
    let col = c[q] * F * (0.88 + 0.24 * film);
    col = col / (1 + col * 0.72) * 1.38;
    px[o + q] = Math.min(255, Math.pow(col, 1 / 2.2) * 255);
  }
  px[o + 3] = alpha * 255;
}
ctx.putImageData(img, 0, 0);
</script>
</body>
</html>
